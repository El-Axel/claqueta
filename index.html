<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1511">
<title>Claqueta · Inicio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230D1511'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%235BE08A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Tailwind por CDN. Su paleta y fuentes viven en js/tailwind.config.js -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind.config.js"></script>

<!-- Estilos propios compartidos -->
<link rel="stylesheet" href="css/style.css">
</head>
<body class="font-sans">

<div class="fondo" aria-hidden="true"></div>

<div class="app">

  <!-- Barra superior -->
  <header class="flex items-center justify-between pt-[calc(env(safe-area-inset-top)+1rem)] entra" style="--i:0">
    <span class="cristal btn-ic" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 10h16v9H4zM4 10l1.6-4.2 4.4.9L8.6 10M10 6.7l4.4.9L13 10M14.4 7.6l4.4.9L17.4 10"/></svg>
    </span>
    <p class="font-bold tracking-tight">Claqueta</p>
    <a href="ajustes.html" class="cristal btn-ic" aria-label="Ajustes">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>
    </a>
  </header>

  <!-- Saludo -->
  <section class="mt-16 mb-8 entra" style="--i:1">
    <p id="fecha" class="cap text-sm muted"></p>
    <h1 id="saludo" class="text-[2.6rem] font-extrabold leading-none tracking-tight mt-2"></h1>
    <p id="resumen" class="muted mt-3 max-w-[30ch] leading-snug"></p>
  </section>

  <!-- Por cobrar -->
  <a href="clientes.html" class="cristal bloque flex items-center justify-between entra" style="--i:2">
    <div>
      <p class="text-sm muted">Por cobrar</p>
      <p id="porCobrar" class="num text-4xl mt-1">$0</p>
    </div>
    <span class="cristal btn-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
  </a>

  <!-- Dos tarjetas -->
  <div class="grid grid-cols-2 gap-3 mt-3">
    <a href="cotizar.html" class="tile-verde bloque min-h-[9.5rem] flex flex-col justify-between entra" style="--i:3">
      <div class="flex justify-between items-start">
        <p class="text-sm leading-tight text-white/80">Cotizaciones<br>abiertas</p>
        <span class="btn-ic bg-white/15" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM9 12h6M9 16h6"/></svg></span>
      </div>
      <p id="abiertas" class="num text-5xl">0</p>
    </a>
    <a href="agenda.html" class="tile-oscuro bloque min-h-[9.5rem] flex flex-col justify-between entra" style="--i:4">
      <div class="flex justify-between items-start">
        <p class="text-sm leading-tight muted">Trabajos<br>próximos</p>
        <span class="btn-ic bg-white/10" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
      </div>
      <p id="proxNum" class="num text-5xl">0</p>
    </a>
  </div>

  <!-- Accesos rápidos -->
  <section class="grid grid-cols-4 gap-2.5 mt-3 entra" style="--i:5" aria-label="Accesos rápidos">
    <a href="cotizar.html?nueva=1" class="cristal acc"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM12 11v6M9 14h6"/></svg>Nueva cotización</a>
    <a href="agenda.html" class="cristal acc"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>Agendar trabajo</a>
    <a href="clientes.html?nuevo=1" class="cristal acc"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7M19 8v6M16 11h6"/></svg>Nuevo cliente</a>
    <a href="ajustes.html#equipos" class="cristal acc"><svg viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>Mis equipos</a>
  </section>

  <!-- Cobrado -->
  <section class="cristal bloque mt-3 entra" style="--i:6">
    <div class="flex items-end justify-between">
      <div>
        <p class="text-sm muted">Cobrado de lo acordado</p>
        <p id="cobradoTxt" class="text-sm mt-1"></p>
      </div>
      <p id="cobradoPct" class="num text-3xl">0%</p>
    </div>
    <div class="barra mt-4"><i id="cobradoBarra"></i></div>
  </section>

  <!-- Próximos trabajos -->
  <h2 class="text-xl font-extrabold tracking-tight mt-9 mb-3 entra" style="--i:7">Próximos trabajos</h2>
  <div id="proximos" class="grid gap-2.5 entra" style="--i:8"></div>

  <!-- Resumen -->
  <section class="grid grid-cols-3 gap-3 mt-6 entra" style="--i:9" aria-label="Resumen">
    <div class="cristal bloque !p-4"><p id="nClientes" class="num text-2xl">0</p><p class="text-xs muted mt-1">Clientes</p></div>
    <div class="cristal bloque !p-4"><p id="nEquipos" class="num text-2xl">0</p><p class="text-xs muted mt-1">Equipos</p></div>
    <div class="cristal bloque !p-4"><p id="nAceptadas" class="num text-2xl">0</p><p class="text-xs muted mt-1">Aceptadas</p></div>
  </section>

</div>

<!-- Navegación flotante -->
<nav class="dock cristal" aria-label="Principal">
  <a href="index.html" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Inicio</a>
  <a href="cotizar.html"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM9 12h6M9 16h6"/></svg>Cotizar</a>
  <a href="agenda.html"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</a>
  <a href="clientes.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>Clientes</a>
</nav>

<script src="js/app.js"></script>
<script src="js/ui.js"></script>
<script src="js/inicio.js"></script>
</body>
</html>
